name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate tag matches VERSION
        run: |
          version="${GITHUB_REF_NAME#v}"
          current=$(cat VERSION)
          if [ "$version" != "$current" ]; then
            echo "Tag v${version} does not match VERSION file: ${current}" >&2
            exit 1
          fi
      - name: Run conformance
        run: python conformance/runner/run.py
      - name: Run reference codec tests
        working-directory: implementations/go
        run: go test ./...
  test:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [verify-tag, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Bundle vectors and spec
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/lep-${GITHUB_REF_NAME}-vectors.tar.gz" \
            VERSION test-vectors spec registry
          (cd dist && sha256sum * > checksums.sha256)
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/lep-*.tar.gz
            dist/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
