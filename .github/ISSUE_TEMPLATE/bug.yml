name: Bug report
description: Report an interoperability, specification, or reference-codec defect.
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LEP. Never include device keys, private endpoints, customer memory, or exploit details here. Use private vulnerability reporting for sensitive reports.
  - type: input
    id: version
    attributes:
      label: LEP version or commit
      placeholder: v1.0.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Reference codec (implementations/go/)
        - Conformance runner (conformance/runner/)
        - Specification (spec/)
        - Registry (registry/)
        - Golden vectors (test-vectors/)
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed result and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal non-sensitive reproducer or vector
      description: List exact steps, commands, or a hex vector that triggers the issue.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add logs, result codes, or register summaries only after removing identifiers and sensitive memory.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same behavior.
          required: true
        - label: This report contains no secrets, customer memory, or private firmware.
          required: true
        - label: I can help validate a fix against a consumer codec.
          required: false
